<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>preflight を確かめる</title>
</head>
<body>
<h1>preflight を確かめる</h1>
<p>このページは <code>http://localhost:8080</code>、API は <code>http://localhost:8081</code> です。ポートが違うので別オリジンになります。</p>
<pre id="log"></pre>
<script>
const API = "http://localhost:8081";
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };

window.send = async function (path, init) {
  try {
    const res = await fetch(API + path, init);
    log(path + " -> " + res.status);
  } catch (e) {
    log(path + " -> ERROR " + e.message);
  }
};
</script>
</body>
</html>
