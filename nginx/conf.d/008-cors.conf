# 008-cors.conf — 記事 008 の設定の正本（CORS / preflight）
#
# 🔴 別オリジンはポート違いで作る。ホスト名を足すと /etc/hosts の編集（sudo）が要り、
#    読者が再現できなくなる。オリジンは scheme + host + port で決まるため、
#    localhost:8080（ページ）と localhost:8081（API）は別オリジンになる。
#
# 🔴 preflight（OPTIONS）がいつ再発したかはサーバ側の到着記録でしか観測できない。
#    ブラウザ内部の preflight キャッシュを覗く API は存在しない。
#
# パスの末尾にタグを付けられるようにしてある（/008/maxage-86400/cr など）。
# preflight キャッシュの鍵は URL を含むため、ブラウザごとに別タグを使えば
# 同じ設定を同時に測っても記録が混ざらない。

log_format preflight '$time_iso8601 $request_method $uri max_age=$sent_http_access_control_max_age';

# 拡張ログ。Authorization は「あるか / ないか」だけを残す（値そのものは書かない）。
map $http_authorization $auth_present {
    default "yes";
    ""      "no";
}
# OPTIONS のときだけ auth_basic を off にする（nginx 1.5.6 以降 auth_basic は変数を取る）。
# limit_except の内側ブロックは外側の content handler（root / try_files）を継承しないため、
# 静的配信と併用するときはこちらを使う。
map $request_method $authzone_realm {
    default "measurement zone";
    OPTIONS "off";
}

log_format preflight_ext '$time_iso8601 $request_method $uri status=$status '
                         'max_age=$sent_http_access_control_max_age '
                         'acao=$sent_http_access_control_allow_origin '
                         'auth=$auth_present origin=$http_origin '
                         'req_method=$http_access_control_request_method '
                         'req_headers=$http_access_control_request_headers';

server {
    listen 81;
    server_name localhost;

    access_log /results/008-cors-max-age/preflight.log preflight;

    # ① Access-Control-Max-Age を宣言しない — ブラウザの既定値が出る
    location ~ ^/008/maxage-default(/.*)?$ {
        add_header Access-Control-Allow-Origin  "http://localhost:8080" always;
        add_header Access-Control-Allow-Headers "x-probe"               always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"    always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "maxage-default\n";
    }

    # ② 値を宣言する — パスの数字がそのまま Access-Control-Max-Age になる
    #    例: /008/maxage-2 → 2 秒 / /008/maxage-86400/cr → 86400 秒
    location ~ ^/008/maxage-(?<ma>\d+)(/.*)?$ {
        add_header Access-Control-Allow-Origin  "http://localhost:8080" always;
        add_header Access-Control-Allow-Headers "x-probe"               always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"    always;
        add_header Access-Control-Max-Age       $ma                     always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "maxage\n";
    }

    # ③ preflight の発生境界（008 の 2 枚目）— 単純リクエストかどうかで分かれる
    location ~ ^/008/boundary(/.*)?$ {
        add_header Access-Control-Allow-Origin  "http://localhost:8080"                      always;
        add_header Access-Control-Allow-Headers "x-probe, content-type"                      always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"            always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "boundary\n";
    }

    # ------------------------------------------------------------------
    # ④ キャッシュの鍵の粒度（008 の 3 枚目）
    #
    # 🔴 仕様はエントリを「レスポンスの Access-Control-Allow-Methods /
    #    -Headers に列挙された分」だけ作る。リクエストが要求した分ではない。
    #    そこで応答を 2 系統に分けて、列挙の広さが preflight 回数を変えるかを測る。
    # ------------------------------------------------------------------

    # (a) 固定列挙 — 要求に関係なく広く列挙する
    location ~ ^/008/cachekey/fixed(/.*)?$ {
        access_log /results/008-cache-key/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin      "http://localhost:8080"                  always;
        add_header Access-Control-Allow-Credentials "true"                                   always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS"        always;
        add_header Access-Control-Allow-Headers     "x-probe, x-extra, content-type"         always;
        add_header Access-Control-Max-Age           "30"                                     always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "cachekey-fixed\n";
    }

    # (b) エコー — 要求されたものだけを返す
    location ~ ^/008/cachekey/echo(/.*)?$ {
        access_log /results/008-cache-key/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin      "http://localhost:8080"                  always;
        add_header Access-Control-Allow-Credentials "true"                                   always;
        add_header Access-Control-Allow-Methods     $http_access_control_request_method      always;
        add_header Access-Control-Allow-Headers     $http_access_control_request_headers     always;
        add_header Access-Control-Max-Age           "30"                                     always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "cachekey-echo\n";
    }

    # ------------------------------------------------------------------
    # ⑤ Access-Control-Allow-Headers の * と Authorization（008 の 4 枚目）
    #
    # 🔴 仕様では Authorization だけが「CORS non-wildcard request-header name」で、
    #    * では覆われない。実装が追随しているかを測る。
    # ------------------------------------------------------------------

    location ~ ^/008/wildcard/star(/.*)?$ {
        access_log /results/008-wildcard-auth/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"        always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"           always;
        add_header Access-Control-Allow-Headers "*"                            always;
        add_header Access-Control-Max-Age       "30"                           always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "wildcard-star\n";
    }

    location ~ ^/008/wildcard/explicit(/.*)?$ {
        access_log /results/008-wildcard-auth/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"        always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"           always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"       always;
        add_header Access-Control-Max-Age       "30"                           always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "wildcard-explicit\n";
    }

    location ~ ^/008/wildcard/credential(/.*)?$ {
        access_log /results/008-wildcard-auth/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin      "http://localhost:8080"    always;
        add_header Access-Control-Allow-Credentials "true"                     always;
        add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS"       always;
        add_header Access-Control-Allow-Headers     "authorization, x-probe"   always;
        add_header Access-Control-Max-Age           "30"                       always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "wildcard-credential\n";
    }

    # ------------------------------------------------------------------
    # ⑥ リダイレクト（008 の 5 枚目）
    # ------------------------------------------------------------------

    location = /008/redirect/direct {
        access_log /results/008-redirect/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"                 always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS"                     always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"                always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "direct\n";
    }

    # R1: 単純リクエスト（GET・独自ヘッダなし）が同一オリジン内で 301
    location = /008/redirect/simple {
        access_log /results/008-redirect/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        return 301 http://localhost:8081/008/redirect/simple-target;
    }
    location = /008/redirect/simple-target {
        access_log /results/008-redirect/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        return 200 "simple-target\n";
    }

    # R2: preflight を伴うリクエストの「本番送信」が 301
    location = /008/redirect/preflighted {
        access_log /results/008-redirect/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"                 always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS"                     always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"                always;
        if ($request_method = OPTIONS) { return 204; }
        return 301 http://localhost:8081/008/redirect/preflighted-target;
    }
    location = /008/redirect/preflighted-target {
        access_log /results/008-redirect/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"                 always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS"                     always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"                always;
        return 200 "preflighted-target\n";
    }

    # R3: preflight（OPTIONS）自体が 301 を返す
    location = /008/redirect/optionsredirect {
        access_log /results/008-redirect/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"                 always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS"                     always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"                always;
        if ($request_method = OPTIONS) {
            return 301 http://localhost:8081/008/redirect/preflighted-target;
        }
        return 200 "should-not-be-reached\n";
    }

    # R4: 別オリジン（:8083）へリダイレクト。Authorization が残るかを第 3 オリジン側で記録する
    location = /008/redirect/crossorigin {
        access_log /results/008-redirect/preflight.log preflight_ext;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"                 always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS"                     always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"                always;
        if ($request_method = OPTIONS) { return 204; }
        return 301 http://localhost:8083/008/redirect/third-target;
    }
    # ------------------------------------------------------------------
    # ⑦ Basic 認証をかけた領域への preflight（008 の 7 枚目）
    #
    # 🔴 preflight（OPTIONS）は認証情報を載せずに飛ぶ。仕様（WHATWG Fetch）が
    #    preflight リクエストの構築時に credentials mode を "same-origin" 相当へ
    #    落とすため、Authorization も Cookie も付かない。
    #    したがって認証を OPTIONS にもかけると、preflight だけが 401 で落ちる。
    # 🔴 使うのは測定専用の合成ユーザー（demo）。実在のアカウントではない。
    # ------------------------------------------------------------------

    # 🔴 3 ケースはすべて実ファイルを返す（root + try_files）。
    #    return を content handler にすると rewrite フェーズで返ってしまい、
    #    access フェーズの auth_basic が一度も動かない（B2 がその実例）。

    # B0: 認証を location 全体にかける（OPTIONS も access フェーズに入る）
    location ~ ^/008/authzone/guarded(/.*)?$ {
        access_log /results/008-preflight-auth/preflight.log preflight_ext;
        auth_basic           "measurement zone";
        auth_basic_user_file /etc/nginx/conf.d/008-authzone.htpasswd;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"    always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"       always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"   always;
        add_header Access-Control-Max-Age       "30"                       always;
        root /usr/share/nginx/public;
        try_files /authzone/payload.txt =404;
    }

    # B1: OPTIONS だけ認証から外す（$authzone_realm が OPTIONS のとき off になる）
    location ~ ^/008/authzone/exempt(/.*)?$ {
        access_log /results/008-preflight-auth/preflight.log preflight_ext;
        auth_basic           $authzone_realm;
        auth_basic_user_file /etc/nginx/conf.d/008-authzone.htpasswd;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"    always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"       always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"   always;
        add_header Access-Control-Max-Age       "30"                       always;
        # 静的配信の content handler は OPTIONS に 405 を返す。preflight には 204 を返す必要がある。
        if ($request_method = OPTIONS) { return 204; }
        root /usr/share/nginx/public;
        try_files /authzone/payload.txt =404;
    }

    # B2: 認証を書いたうえで return を content handler にした（守れているつもりの設定）
    location ~ ^/008/authzone/shortcut(/.*)?$ {
        access_log /results/008-preflight-auth/preflight.log preflight_ext;
        auth_basic           "measurement zone";
        auth_basic_user_file /etc/nginx/conf.d/008-authzone.htpasswd;
        add_header Access-Control-Allow-Origin  "http://localhost:8080"    always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"       always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"   always;
        add_header Access-Control-Max-Age       "30"                       always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "authzone-shortcut\n";
    }
}

# ------------------------------------------------------------------
# ⑧ add_header の落ち方（008 の 6 枚目）— ブラウザ不要・curl で測る
#
# 🔴 add_header は既定で 200/201/204/206/301/302/303/304/307/308 にしか付かない。
#    always を付けると応答コードに関係なく付く。
# 🔴 現在のレベルに add_header が 1 つでもあると、親レベルの add_header は
#    継承されない。1.29.3 で追加された add_header_inherit merge; で足せる。
# ------------------------------------------------------------------
server {
    listen 82;
    server_name localhost;

    access_log /results/008-header-always/access.log preflight_ext;

    # サーバレベルで CORS を宣言する（よくある書き方）
    add_header Access-Control-Allow-Origin  "http://localhost:8080" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"    always;
    add_header Access-Control-Allow-Headers "x-probe"               always;

    # H0 / H1: always あり（サーバレベルをそのまま継承する）
    location = /008/always/ok  { return 200 "ok\n"; }
    location = /008/always/err { return 500; }

    # H2 / H3: always なし（同じ 3 本を location で上書きして always を外す）
    location = /008/noalways/ok {
        add_header Access-Control-Allow-Origin  "http://localhost:8080";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "x-probe";
        return 200 "ok\n";
    }
    location = /008/noalways/err {
        add_header Access-Control-Allow-Origin  "http://localhost:8080";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "x-probe";
        return 500;
    }

    # H4: CORS と無関係な add_header を 1 つ足しただけで親の 3 本が消えるか
    location = /008/inherit/off {
        add_header X-Extra "1" always;
        return 200 "ok\n";
    }

    # H5: add_header_inherit merge; で親の値を足す（1.29.3 で追加）
    location = /008/inherit/merge {
        add_header_inherit merge;
        add_header X-Extra "1" always;
        return 200 "ok\n";
    }
}

# 第 3 のオリジン（:8083）— R4 のリダイレクト先。Authorization が届いたかを記録する
server {
    listen 83;
    server_name localhost;

    access_log /results/008-redirect/third-origin.log preflight_ext;

    location = /008/redirect/third-target {
        add_header Access-Control-Allow-Origin  "http://localhost:8080"                 always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS"                     always;
        add_header Access-Control-Allow-Headers "authorization, x-probe"                always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 "third-target\n";
    }
}
