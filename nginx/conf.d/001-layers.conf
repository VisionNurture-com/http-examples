# 001-layers.conf — 記事 001「HTTP が繋がらない：層で切り分ける」の設定の正本
#
# 🔴 記事に載せる設定は本ファイルが正本。記事側で設定を書き起こさず、ここから引用する
#    （check-provenance.mjs が引用断片の実在を突合する）。
#
# 測る対象:
#   4 つの観測手段（ブラウザ / curl / openssl s_client / サーバ側の到着記録）が、
#   5 つの層（DNS / TCP / TLS / HTTP / アプリ）のどこまでを見せるか。
#   そのために層ごとに失敗を人為的に起こす。
#
# 🔴 ポートは 95（平文）と 450（TLS）。使用中は 80/81/82/83/84/85/86/87/88/91/92/94 と
#    443/444/445/446/449 で、同じポート × 同じ server_name は後勝ちで一方が黙って
#    ignored になる。口を足したら nginx -t の warn を必ず読むこと。
#
# 🔴 本ファイルは「到着した要求」しか記録できない。DNS / TCP / TLS で落ちた要求は
#    そもそも nginx に届かないため access.log に行が出ない。
#    「行が出ない」こと自体が本記事の観測値である（0 行 = 届いていない）。

# 到着記録。$msec を先頭に置くのは他記事（002 / 004 / 006）と同じ規約。
# cs はケース識別子で、測定スクリプトがクエリとして付ける。
log_format s001 '$msec $time_iso8601 $request_method $status uri="$request_uri" '
                'cs=$arg_cs proto=$server_protocol scheme=$scheme '
                'ssl_proto="$ssl_protocol" ssl_cipher="$ssl_cipher"';

# アプリが落ちている状態を作るための upstream。
# 🔴 9 番ポートは discard（RFC 863）で、誰も待ち受けていない。
#    nginx は接続に失敗して 502 を返す = アプリ層の失敗。
upstream app_down_upstream {
    server 127.0.0.1:9;
}

server {
    # --- 平文の口（K0 / K5 / K6 / K7）---------------------------------------
    listen 95;
    server_name localhost example.test;

    access_log /results/001-layers/access.log s001;

    # K0: 陽性対照。すべての層が通る
    location = /001/ok {
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # K5: HTTP 層で失敗する（サーバは応答するが要求は通らない）
    location = /001/http-503 {
        add_header Content-Type text/plain always;
        return 503 "service unavailable\n";
    }

    # K6: アプリ層で失敗する（nginx は動いているが上流が落ちている）
    location = /001/app-down {
        proxy_pass http://app_down_upstream;
        proxy_set_header Host $host;
        # 待たせずに 502 を返す（測定時間を短くするため）
        proxy_connect_timeout 2s;
    }
}

server {
    # --- TLS の口（K4）------------------------------------------------------
    #
    # 🔴 ここだけ別の証明書を使う。server.crt は localhost / example.test /
    #    *.example.test を含むため、名前の不一致を作れない。
    #    wrongname.crt は other.invalid だけを含む自己署名で、
    #    localhost へ接続したクライアントから見ると必ず名前が一致しない。
    listen 450 ssl;
    http2 on;
    server_name localhost example.test;

    ssl_certificate     /etc/nginx/certs/wrongname.crt;
    ssl_certificate_key /etc/nginx/certs/wrongname.key;

    access_log /results/001-layers/access.log s001;

    location = /001/ok {
        add_header Content-Type text/plain always;
        return 200 "ok over tls\n";
    }
}

server {
    # --- TLS の口・要因を分離した版（K4b）-----------------------------------
    #
    # 🔴 K4（wrongname.crt）は自己署名かつ名前不一致で 2 要因が混ざる。
    #    ここは mkcert が発行した証明書なので CA は信頼され、
    #    localhost へ接続したときの失敗要因は「名前が一致しない」だけになる。
    listen 451 ssl;
    http2 on;
    server_name localhost example.test;

    ssl_certificate     /etc/nginx/certs/mismatch.crt;
    ssl_certificate_key /etc/nginx/certs/mismatch.key;

    access_log /results/001-layers/access.log s001;

    location = /001/ok {
        add_header Content-Type text/plain always;
        return 200 "ok over tls (name mismatch only)\n";
    }
}
