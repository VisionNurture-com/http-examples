# 000-base.conf — 共通の入口（測定の土台）
#
# 🔴 記事に載せる設定は本ディレクトリが正本。記事側で設定を書き起こさず、
#    ここから引用する（check-provenance.mjs が引用断片の実在を突合する）。

upstream app_upstream {
    server app:3000;
}

server {
    listen 80;
    server_name localhost example.test;

    # 測定用の静的ページ（008 の probe など）
    location /008/ {
        alias /usr/share/nginx/public/008/;
        index index.html;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost example.test;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
