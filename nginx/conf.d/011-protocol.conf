# 011-protocol.conf — 記事 011 の設定の正本（HTTP/1.1 / HTTP/2 / HTTP/3）
#
# 🔴 HTTP/3 は TCP ではなく UDP の 443 を使う。compose 側でも
#    "8443:443/udp" を開けていないとハンドシェイクが始まらない。
#
# 🔴 転送速度の比較を compose 上で行わないこと（2026-08-07 実測判定）。
#    ハンドシェイクは通る（curl --http3-only で proto=3 / 200）が、20 MiB の
#    ダウンロードで HTTP/2 = 192.2 MiB/s に対し HTTP/3 = 106.6 MiB/s と 44.5% 低い。
#    この差が QUIC の性質か Docker Desktop のユーザー空間 UDP 転送の歪みかを
#    切り分けられないため、速度の実効値は M3（vm/）で測る。
#
# Alt-Svc は「この接続は HTTP/3 でも話せる」という広告。ブラウザは
# まず HTTP/2 で接続し、この広告を見てから次回以降 HTTP/3 を試す。
# curl は --http3 で最初から QUIC を張れるため、広告なしでも測れる。

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    http3 on;

    server_name h3.localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # HTTP/3 の広告（ブラウザ向け）
    add_header Alt-Svc 'h3=":8443"; ma=86400' always;

    # どのプロトコルで届いたかを応答から観測できるようにする
    add_header X-Observed-Protocol $server_protocol always;

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 転送速度の比較用。実測時に大きめのファイルを置いて h2 / h3 を突き合わせる。
    # 中身はコミットしない（生成物）。
    location /_probe/ {
        alias /probe/;
        add_header X-Observed-Protocol $server_protocol always;
    }
}
