# 012-compression.conf — 記事 012 の設定の正本（圧縮方式と圧縮辞書）
#
# 🔴 記事に載せる設定は本ファイルが正本。記事側で書き起こさず、ここから引用する
#    （check-provenance.mjs が引用断片の実在を突合する）。
#
# ねらい: nginx に RFC 9842（Compression Dictionary Transport）のモジュールは無い。
#         それでも「差分を事前に作っておき、条件が合ったときだけ差し替える」形なら
#         素の nginx で配信できるかを測る。圧縮そのものはサーバ側で行わない。
#
# 🔴 ブラウザは辞書を持っているときだけ Available-Dictionary と Accept-Encoding: dcb/dcz を
#    送ってくる。したがって「辞書の一致」と「エンコーディングの受け入れ」は別々に見る。
#    片方だけで分岐すると、辞書を持たない客へ差分を返して壊す。

# --- 1. ブラウザが申告した辞書が、こちらの持っている辞書と同じか ---
#
# Available-Dictionary は Structured Field Byte Sequence。コロンで挟んだ base64 で届く。
# 値は public/012/bundle-v1.js の SHA-256。フィクスチャを差し替えたらここも変える
# （node tools/make-012-artifacts.mjs が sha256Base64 を出力する）。
map $http_available_dictionary $dict_matched {
    default                                            0;
    ":nhPjQEQF8u4MC+YY/ts3K+PFHVIfPDLxMZYsdSy0TG8=:"   1;
}

# --- 2. ブラウザが受け入れると言っているエンコーディング ---
#
# 先に書いたものが優先される。dcb（Brotli）を dcz（Zstandard）より優先する。
map $http_accept_encoding $dict_encoding {
    default                       "";
    "~*(^|,\s*)dcb(\s*[,;]|$)"    "dcb";
    "~*(^|,\s*)dcz(\s*[,;]|$)"    "dcz";
}

# --- 3. 1 と 2 の両方が揃ったときだけ差分ファイルへ差し替える ---
map "$dict_matched:$dict_encoding" $dict_suffix {
    default     "";
    "1:dcb"     ".dcb";
    "1:dcz"     ".dcz";
}

map "$dict_matched:$dict_encoding" $dict_content_encoding {
    default     "";
    "1:dcb"     "dcb";
    "1:dcz"     "dcz";
}

# --- 4. dcz を選ぶ経路（対照）---
#
# 🔴 ブラウザは dcb と dcz の両方を受け入れると言ってくる。どちらを返すかは**サーバが決める**。
#    上の map は dcb を先に書いてあるため、実ブラウザでは dcz が一度も使われない。
#    dcz 側も配信・復号できることを確かめるため、dcz を選ぶ入口を別に用意する。
map $http_accept_encoding $accepts_dcz {
    default                       "";
    "~*(^|,\s*)dcz(\s*[,;]|$)"    "dcz";
}

map "$dict_matched:$accepts_dcz" $dcz_suffix {
    default     "";
    "1:dcz"     ".dcz";
}

map "$dict_matched:$accepts_dcz" $dcz_content_encoding {
    default     "";
    "1:dcz"     "dcz";
}

# --- 4.5. early_hints を書いたときに 103 が客まで届くか（1.29.0 以降）---
#
# 🔴 既定（このディレクティブを書かない状態）では、上流の 103 はここで止まる。
#    その既定の状態で 18 通りを測ってあるため、**/012/eh は絶対に触らない**。
#    書いたときの挙動は別の入口（/012/ehon）で測り、2 つを並べて比べる。
#
# 条件は公式ドキュメントの例と同じ。値が空でも "0" でもなければ 103 を渡す。
# $http_sec_fetch_mode が navigate のとき、かつ HTTP/2 か HTTP/3 のときだけ通る。
map $http_sec_fetch_mode $early_hints_on {
    navigate $http2$http3;
}

# --- 5. Vary を落とすと何が起きるか（事故の再現）---
#
# 🔴 説明ではなく再現にするには共有キャッシュが要る。前段に proxy_cache を置き、
#    「辞書を持つ客 → 持たない客」の順で同じ URL を叩く。
proxy_cache_path /tmp/nginx-cache-012 keys_zone=cache012:1m levels=1:2 max_size=32m inactive=10m;

# 到着記録。何を受け入れると言い、どの辞書を申告し、何を返したかを 1 行に残す
log_format dict012 '$time_iso8601 "$request" ae="$http_accept_encoding" '
                   'avail="$http_available_dictionary" dict_matched=$dict_matched '
                   'ce="$sent_http_content_encoding" served="$sent_http_x_served_file" '
                   'bytes=$body_bytes_sent status=$status';

server {
    # 443 は 000-base.conf が localhost を取っているため、012 は専用の入口を持つ。
    # 名前で来ても（dict.example.test）ポートで来ても（localhost:445）同じ設定に当たる。
    # 🔴 firefox / webkit は Chrome の --host-resolver-rules を持たないため、
    #    どのエンジンからでも測れるように localhost で開ける口を用意する。
    listen 443 ssl;
    listen 445 ssl;
    http2 on;

    # 証明書は localhost と *.example.test の両方を含むため、どちらでも警告は出ない
    server_name dict.example.test localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 事前に作った圧縮済みファイルを配る。nginx 側で圧縮し直さない
    gzip off;

    root /usr/share/nginx/public;

    # 🔴 到着記録を残す。ブラウザ側の観測だけでは「辞書を送ったが一致しなかった」と
    #    「そもそも辞書を送っていない」を分けられない。
    access_log /results/012-dictionary/access.log dict012;

    # 辞書として使ってよい資源であることを宣言する。
    # match は URLPattern。match-dest を絞らないと、画像などにも辞書が使われうる。
    location = /012/bundle-v1.js {
        default_type application/javascript;
        add_header Use-As-Dictionary 'match="/012/bundle-*.js", match-dest=("script"), id="bundle-v1"' always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Served-File "bundle-v1.js" always;
    }

    # 本体。辞書が一致し、かつ dcb / dcz を受け入れる客にだけ差分を返す。
    location = /012/bundle-v2.js {
        default_type application/javascript;

        # 🔴 Vary を落とすと、辞書を持つ客への差分が共有キャッシュに載り、
        #    辞書を持たない客へ配られる。復号できず壊れる。
        add_header Vary "Accept-Encoding, Available-Dictionary" always;

        # 値が空のとき nginx はヘッダ自体を出さない。辞書なしの客には素で返る
        add_header Content-Encoding $dict_content_encoding always;
        add_header X-Served-File "bundle-v2.js$dict_suffix" always;

        # 🔴 測定のため毎回ワイヤへ出す。キャッシュに載ると 304 が返り、
        #    「辞書が使われなかった」のか「そもそも取りにいっていない」のか分けられない
        add_header Cache-Control "no-store" always;

        alias /usr/share/nginx/public/012/bundle-v2.js$dict_suffix;
    }

    # dcz を選ぶ対照。中身は bundle-v2.js と同一で、サーバの選び方だけが違う。
    # 辞書の match は "/012/bundle-*.js" なので、この名前も同じ辞書の対象に入る。
    location = /012/bundle-v2-dcz.js {
        default_type application/javascript;
        add_header Vary "Accept-Encoding, Available-Dictionary" always;
        add_header Content-Encoding $dcz_content_encoding always;
        add_header X-Served-File "bundle-v2.js$dcz_suffix" always;
        add_header Cache-Control "no-store" always;

        alias /usr/share/nginx/public/012/bundle-v2.js$dcz_suffix;
    }

    # 辞書を使わない比較用。事前圧縮したファイルを拡張子で直接指す
    location /012/raw/ {
        alias /usr/share/nginx/public/012/;
        default_type application/javascript;
        add_header X-Served-File $uri always;
    }

    # 🔴 103 Early Hints をアプリから受け取り、そのまま客へ渡せるか。
    #    prefix が長いほうが勝つため、/012/ より先にこちらが当たる。
    #    /012/eh と /012/eh-asset.css の両方をアプリへ回す。
    location /012/eh {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "nginx-proxy" always;
    }

    # 🔴 上と同じアプリの同じ経路へ回すが、こちらだけ early_hints を書く。
    #    違いはこの 1 行だけにして、「書いたかどうか」以外が動かないようにする。
    location /012/ehon {
        early_hints $early_hints_on;
        rewrite ^/012/ehon(.*)$ /012/eh$1 break;
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "nginx-proxy-early-hints" always;
    }

    location /012/ {
        alias /usr/share/nginx/public/012/;
        index index.html;
    }
}

# --- 事故の再現用オリジン（平文・コンテナ内からのみ） ---
#
# 2 つの入口を出す。違いは Vary を出すかどうかだけ。
server {
    listen 86;
    server_name localhost;

    root /usr/share/nginx/public;
    gzip off;

    # 🔴 事故の側: Vary を出さない。共有キャッシュは「辞書の有無で応答が変わる」ことを
    #    知りようがないため、辞書を持つ客への差分を全員へ配ってしまう。
    location = /012/novary.js {
        default_type application/javascript;
        add_header Content-Encoding $dict_content_encoding always;
        add_header X-Served-File "bundle-v2.js$dict_suffix" always;
        alias /usr/share/nginx/public/012/bundle-v2.js$dict_suffix;
    }

    # 対照: 同じ内容で Vary を出す
    location = /012/withvary.js {
        default_type application/javascript;
        add_header Vary "Accept-Encoding, Available-Dictionary" always;
        add_header Content-Encoding $dict_content_encoding always;
        add_header X-Served-File "bundle-v2.js$dict_suffix" always;
        alias /usr/share/nginx/public/012/bundle-v2.js$dict_suffix;
    }
}

# --- 共有キャッシュ（前段） ---
server {
    listen 446 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /012/ {
        proxy_pass http://127.0.0.1:86;
        proxy_cache cache012;
        proxy_cache_valid 200 5m;
        # 誰の要求で入ったキャッシュかを追えるようにする
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
