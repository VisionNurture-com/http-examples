# 003-methods.conf — 記事 003「PUT か PATCH か：冪等性で決める」の設定の正本
#
# 🔴 記事に載せる設定は本ファイルが正本。記事側で設定を書き起こさず、ここから引用する
#    （check-provenance.mjs が引用断片の実在を突合する）。
#
# 判定方針: ワイヤに出たメソッドは、クライアントの申告ではなく nginx が受け取った
#           $request_method で読む。form の method 偽装も、リダイレクトでのメソッド変換も、
#           「送ったつもり」と「届いたもの」が食い違う場所そのものが観測対象になる。
#
# 🔴 リダイレクトは 1 回の操作で 2 行以上を書く。run.sh は開始マーカー以降だけを集計し、
#    冒頭で nginx -s reopen を実行する（動かしたままログを置き換えると削除済み inode へ
#    書き続け、到着記録が丸ごと消える）。

# 到着記録。cs はケース、br はエンジンの識別子で、測定スクリプトがクエリとして付ける。
# body= は Content-Length。307 / 308 でボディが再送されたかを本文の長さで読む。
log_format m003 '$time_iso8601 $request_method $status len=$request_length body="$content_length" '
                'uri="$request_uri" ct="$http_content_type" cs=$arg_cs br=$arg_br';

server {
    # 記事 003 専用の入口
    listen 85;
    server_name localhost;

    access_log /results/003-methods/access.log m003;

    # 🔴 Location を相対参照で出す。既定の絶対 URI はコンテナ内の listen ポート（85）で
    #    組み立てられ、ホスト側の 8085 から追うと繋がらない。測る対象はメソッドの変換で
    #    あってポート転送ではないため、ここで装置側の事情を消しておく。
    absolute_redirect off;

    # --- リダイレクトでメソッドとボディがどうなるか（カード⑤）---
    # こちらが決めるのは返すステータスだけで、メソッドをどう扱うかはクライアントに委ねる。
    # RFC 9110 は 301 / 302 について「歴史的な理由から POST を GET へ変える実装がある」と
    # 注記するにとどまり、307 / 308 でのみメソッドの維持を要求する。
    location = /003/redirect/301 { return 301 /003/sink/301$is_args$args; }
    location = /003/redirect/302 { return 302 /003/sink/302$is_args$args; }
    location = /003/redirect/303 { return 303 /003/sink/303$is_args$args; }
    location = /003/redirect/307 { return 307 /003/sink/307$is_args$args; }
    location = /003/redirect/308 { return 308 /003/sink/308$is_args$args; }

    # --- 測定ページ（M2・form のナビゲーションと先読み）---
    location /003/page/ {
        alias /usr/share/nginx/public/003/;
        index index.html;
    }

    # --- 状態を持つ API はアプリへ回す ---
    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
