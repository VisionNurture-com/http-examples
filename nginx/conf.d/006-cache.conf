# 006-cache.conf — 記事 006「キャッシュが効かない：Cache-Control 設計」の設定の正本
#
# 🔴 記事に載せる設定は本ファイルが正本。記事側で設定を書き起こさず、ここから引用する
#    （check-provenance.mjs が引用断片の実在を突合する）。
#
# 判定方針: ブラウザ内部からキャッシュ命中は覗けないため、サーバ側の到着記録で判定する。
#           「到着 0 件 = キャッシュから読んだ」「200 = 取り直した」「304 = 訊きに来た」。
#           この 3 つを分けるため log_format に status を必ず含める。

# 到着記録。sc / v / cs / br / rt はシナリオ・変種・ケース・エンジン・経路の識別子で、
# 測定スクリプトがクエリとして付ける（1 本のログを後から絞り込めるようにするため）。
log_format c006 '$time_iso8601 "$request" status=$status '
                'sc=$arg_sc v=$arg_v cs=$arg_cs br=$arg_br rt=$arg_rt '
                'inm="$http_if_none_match" ims="$http_if_modified_since" ccreq="$http_cache_control"';

# 判定対象アセットに載せる Cache-Control。クエリ v= で切り替える。
# 空文字のときは add_header 自体が出ない（nginx は空値のヘッダを付けない）。
map $arg_v $c006_cc {
    default     "";
    plain       "max-age=600";
    immutable   "max-age=600, immutable";
    # 期限切れ後の境界を測るための短命版。immutable は fresh のあいだだけ意味を持つ
    # （RFC 8246）ため、stale になってからの扱いに差が出るかを見る。
    plain5      "max-age=5";
    immutable5  "max-age=5, immutable";
    # must-revalidate は fresh のあいだの動きを変えない（006-contradictory で実測済）。
    # 仕様が定めるのは stale になってからの扱いなので、短命版で境界を跨いで測る。
    mustrev5    "max-age=5, must-revalidate";
    nostore     "no-store";
    nocache     "no-cache";
    mustrev     "max-age=600, must-revalidate";
    ns-max      "no-store, max-age=600";
    nc-max      "no-cache, max-age=600";
    ns-nc       "no-store, no-cache";
    conflicted  "private, no-cache, no-store, max-age=0, must-revalidate";
}

# 共有キャッシュ（proxy_cache）の測定用。private を受けたときに保存しないかどうかは
# nginx の公式ドキュメントに明記がないため、予測を書かずに実測する。
proxy_cache_path /var/cache/nginx/006 levels=1:2 keys_zone=c006:10m inactive=10m;

server {
    # 記事 006 専用の入口。http と https の両方を同じ設定で出す。
    # Firefox は immutable を https でのみ honor する（Bugzilla 1267474）ため、
    # スキームを変えただけの対照が取れる形にしておく必要がある。
    listen 84;
    listen 444 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # --- 判定対象のサブリソース（変種はクエリ v= で切り替える）---
    location = /006/asset/app.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        add_header Cache-Control $c006_cc;
        access_log /results/006-cache/access.log c006;
    }

    # --- 差し替えを測るための生成物（run.sh が書き出す・git 管理外）---
    location ^~ /006/gen/ {
        root /usr/share/nginx/public;
        add_header Cache-Control $c006_cc;
        access_log /results/006-cache/access.log c006;
    }

    # --- expires と add_header の競合（カード②）---
    # 公式ドキュメントは expires を「Expires と Cache-Control を追加または変更する」と
    # 書くだけで、add_header Cache-Control と併用したときの結果を規定していない。
    location = /006/exp/expires-only.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        expires 1h;
        access_log /results/006-cache/access.log c006;
    }
    location = /006/exp/addheader-only.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        add_header Cache-Control "no-store";
        access_log /results/006-cache/access.log c006;
    }
    location = /006/exp/both.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        expires 1h;
        add_header Cache-Control "no-store";
        access_log /results/006-cache/access.log c006;
    }
    # 書く順を入れ替えただけのもの。順序で結果が変わるかを見る。
    location = /006/exp/both-reverse.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        add_header Cache-Control "no-store";
        expires 1h;
        access_log /results/006-cache/access.log c006;
    }

    # --- expires の値ごとの生成ヘッダ（カード②の土台）---
    location = /006/exp/max.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        expires max;
        access_log /results/006-cache/access.log c006;
    }
    location = /006/exp/minus.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        expires -1;
        access_log /results/006-cache/access.log c006;
    }
    location = /006/exp/epoch.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        expires epoch;
        access_log /results/006-cache/access.log c006;
    }
    location = /006/exp/off.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        expires off;
        access_log /results/006-cache/access.log c006;
    }
    # 公式は expires が付く応答コードを 200/201/204/206/301/302/303/304/307/308 に
    # 限ると書くが、エラー応答で本当に出ないのかは書かれていない。実際に測る。
    location = /006/exp/error.css {
        expires 1h;
        return 500;
        access_log /results/006-cache/access.log c006;
    }

    # --- add_header の継承（入れ子で親が落ちる）---
    # 公式: 「これらのディレクティブは、現在のレベルに add_header が 1 つも
    #        定義されていない場合に限り、前のレベルから継承される」
    location ^~ /006/exp/nest/ {
        add_header Cache-Control "no-store";
        add_header X-Parent "1";
        access_log /results/006-cache/access.log c006;

        # 自前の add_header を持つので、親の 2 本はどちらも落ちるはず
        location = /006/exp/nest/child-own.css {
            alias /usr/share/nginx/public/006/asset/app.css;
            add_header X-Child "1";
            access_log /results/006-cache/access.log c006;
        }
        # add_header を持たないので親を継承する。そこへ expires を足すとどうなるか。
        location = /006/exp/nest/child-none.css {
            alias /usr/share/nginx/public/006/asset/app.css;
            expires 1h;
            access_log /results/006-cache/access.log c006;
        }
    }

    # --- ETag の有無で条件付き要求の結末が変わるか（シナリオ D）---
    location = /006/etag/on.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        add_header Cache-Control "no-cache";
        access_log /results/006-cache/access.log c006;
    }
    location = /006/etag/off.css {
        alias /usr/share/nginx/public/006/asset/app.css;
        etag off;
        add_header Last-Modified "";
        add_header Cache-Control "no-cache";
        access_log /results/006-cache/access.log c006;
    }

    # --- 共有キャッシュ（シナリオ F）---
    # 上流（app）が返す Cache-Control をそのまま受けて、nginx が保存するかどうかを見る。
    location ^~ /006/shared/ {
        proxy_pass http://app_upstream/006/api/resource$is_args$args;
        proxy_cache c006;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 60s;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log /results/006-cache/access.log c006;
    }

    # --- 測定ページと補助 API はアプリへ回す ---
    location /006/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        access_log /results/006-cache/access.log c006;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
    }
}
