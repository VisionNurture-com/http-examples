# 002-minimal.conf — 記事 002 の入口（リクエストを最小で再現する）
#
# 🔴 記事に載せる設定は本ファイルが正本。記事側で書き起こさず、ここから引用する
#    （check-provenance.mjs が引用断片の実在を突合する）。
#
# 経路を 2 つに分ける理由:
#   000-base.conf の `location /` は素の GET も app へ proxy_pass しており、
#   「nginx が弾いたのか Express が弾いたのか」が混ざる。002 はヘッダを削ったとき
#   どの層で結果が変わったかを分ける必要があるため、静的配信と転送を別の口にする。
#
# gzip について:
#   🔴 nginx の既定は gzip off。「Accept-Encoding を削ると圧縮が消える」という現象は、
#   下の gzip 設定を書いて初めて起きる。記事には既定値とあわせて書く。

server {
    # 🔴 86 は 012-compression.conf が使っている。同じポート × 同じ server_name は
    #    後勝ちで一方が ignored になり、相手のシナリオが黙って壊れる（2026-08-17 に実際に起こした）。
    #    新しい口を足すときは nginx -t の warn を必ず読むこと。
    listen 87;
    server_name localhost;

    gzip on;
    # text/html は gzip_types に書かなくても常に対象。書くと duplicate MIME type の
    # 警告が出る（012 のカード② と同じ型なので、002 では警告そのものを主題にしない）
    gzip_types text/plain application/json;
    gzip_min_length 256;

    # 経路 A: nginx 単独（Express を通さない静的配信）
    location /002/static/ {
        alias /usr/share/nginx/public/002/;
    }

    # 経路 B: nginx → Express
    #
    # 🔴 proxy_set_header は Host だけにしてある。Upgrade / Connection を書いていないため、
    #    接続固有ヘッダは上流へ渡らない（002-upgrade の観測対象）。
    location /002/api/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
    }

    # 経路 B'（上限を上げた口）: 本文の上限だけを変えた対照。
    #
    # 🔴 nginx の既定は client_max_body_size 1m で、curl が Expect: 100-continue を
    #    自動で足し始める大きさとほぼ重なる。既定のままだと 100 Continue の代わりに
    #    413 が返るため、「100 Continue が返る側」を観測できない。上限だけを変えた口を
    #    並べて、同じ本文サイズで応答が分かれることを測る。
    location /002/large/ {
        client_max_body_size 8m;
        proxy_pass http://app_upstream/002/api/;
        proxy_set_header Host $host;
    }
}

# ---------------------------------------------------------------------------
# 対照: ヘッダの上限だけを引き上げた server（002-header-size）
#
# 🔴 large_client_header_buffers は http / server コンテキスト専用で location に
#    書けない。上限を変えた対照を作るには server ブロックがもう 1 つ要る。
#
# 🔴 ポートは足さない。同じ listen 87 のまま server_name だけを分ける。
#    S17 の事故（E-5）は「同じポート × 同じ server_name」で起きた。後勝ちで
#    一方が ignored になり、相手のシナリオが黙って壊れる。ここは「同じポート ×
#    別の server_name」で、nginx が Host を見て正しく振り分ける正規の使い方。
#    測定側は -H "Host: headersize.test" でこちらへ入る。
server {
    listen 87;
    server_name headersize.test;

    # 既定は 4 8k（1 本のヘッダ行が 8k を超えると 400 が返る）。
    # 対照として本数もサイズも上げる。
    large_client_header_buffers 8 32k;

    location /002/static/ {
        alias /usr/share/nginx/public/002/;
    }

    location /002/api/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
    }
}
