# 009-auth.conf — 記事 009 の設定の正本（Authorization が届く経路 / 届かない経路）
#
# 🔴 記事に載せる設定は本ディレクトリが正本。記事側で設定を書き起こさず、
#    ここから引用する（check-provenance.mjs が引用断片の実在を突合する）。
#
# ポートの割り当て（compose.yaml の ports が対応の正本）:
#   91 → 8091  カード①の「別オリジン」（localhost:8080 とポートだけ違う）
#   92 → 8092  カード②の「構成別の到着」（素の転送 / 空文字剥がし / FastCGI）

# ---------------------------------------------------------------------------
# カード①: 別オリジン（ポート差）。中身は :80 と同じ Express へ渡す。
# ---------------------------------------------------------------------------
server {
    listen 91;
    server_name localhost;

    location /009/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# カード②: 構成別の到着
#
# 🔴 nginx が既定で再定義するのは Host と Connection だけで、Authorization は
#    そのまま渡る（ngx_http_proxy_module の proxy_set_header の項）。
#    落とすには空文字を明示的に代入する必要がある。その対照を同じポートに並べる。
# ---------------------------------------------------------------------------
server {
    listen 92;
    server_name localhost;

    # P1 素の転送（既定）。proxy_set_header を Authorization に対して書かない。
    location /009/proxy/whoami {
        proxy_pass http://app_upstream/009/whoami;
        proxy_set_header Host $host;
    }

    # P2 空文字を代入して剥がす。
    #    「値が空文字列のヘッダーはプロキシ先へ渡されない」を使う。
    location /009/strip/whoami {
        proxy_set_header Authorization "";
        proxy_pass http://app_upstream/009/whoami;
        proxy_set_header Host $host;
    }

    # P3 FastCGI へ渡す。fastcgi_pass_request_headers は既定 on のため、
    #    クライアントのヘッダーは HTTP_AUTHORIZATION として渡るはず。
    location /009/fcgi/whoami {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/whoami.php;
    }
}
