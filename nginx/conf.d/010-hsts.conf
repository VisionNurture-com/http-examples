# 010: HSTS —— 解除は効くのか
#
# 測る対象はサーバではなく「ブラウザが覚えている状態」である。したがってこの
# 設定は、ブラウザに状態を作らせる / 消させるための最小の口だけを用意する。
#
# 🔴 口を 94 / 449 に分けた理由:
#   includeSubDomains は「親が STS を送り、子が送らない」形でしか測れない。
#   証明書の SAN は localhost / example.test / *.example.test なので、
#   親に使えるのは example.test だけである（*.example.test の子は 1 段しか
#   マッチしないため x.a.example.test は使えない）。その example.test の
#   80 / 443 は 000-base.conf が取っているので、専用の口を立てる。
#
# 🔴 ブラウザから見えるポートは 80 / 443 でなければならない:
#   RFC 6797 §8.3 の upgrade はスキームだけを置き換え、明示されたポートを
#   保持する。http://example.test:8094 は https://example.test:8094 へ上がり、
#   そこは平文なので必ず失敗する。「HSTS が効いた」と「経路が壊れた」を
#   区別できなくなるため、tools/hsts-proxy.mjs が :80 / :443 に見せかける。

# --- 平文 HTTP（到着したこと自体が「HSTS が効いていない」の証拠）---------
server {
    listen 94;
    server_name example.test hsts-sub.example.test;

    # 🔴 HTTP 上で STS を送っても UA は無視する（RFC 6797 §8.1）。送らない。
    add_header Cache-Control "no-store" always;

    location / {
        default_type text/plain;
        return 200 "plain-http\n";
    }
}

# --- 親（example.test）: STS を送る / 消す --------------------------------
server {
    listen 449 ssl;
    http2 on;
    server_name example.test;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header Cache-Control "no-store" always;
    default_type text/plain;

    # 素の登録（サブドメインには及ばない）
    location = / {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=600" always;
        return 200 "parent-sts\n";
    }

    # includeSubDomains つきの登録
    location = /subs {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=600; includeSubDomains" always;
        return 200 "parent-sts-subs\n";
    }

    # max-age=0 による解除。MDN: 保護された接続で受け取って初めて効く
    location = /off {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=0" always;
        return 200 "parent-sts-off\n";
    }

    # includeSubDomains つきの解除
    location = /off-subs {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=0; includeSubDomains" always;
        return 200 "parent-sts-off-subs\n";
    }

    # STS を一切送らない口（対照）
    location = /quiet {
        add_header Cache-Control "no-store" always;
        return 200 "parent-quiet\n";
    }

    location / {
        return 200 "parent-other\n";
    }
}

# --- 子（hsts-sub.example.test）: 自分では STS を送らない -----------------
# 子がここで STS を送ってしまうと、親の includeSubDomains の効果と
# 子自身の登録を区別できなくなる。送らないことが設計上の要件である。
server {
    listen 449 ssl;
    http2 on;
    server_name hsts-sub.example.test;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header Cache-Control "no-store" always;
    default_type text/plain;

    location / {
        return 200 "child-quiet\n";
    }
}
