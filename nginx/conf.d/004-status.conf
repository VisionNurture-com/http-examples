# 004-status.conf — 記事 004「401 か 403 か：ステータスを選ぶ」の設定の正本
#
# 🔴 記事に載せる設定は本ファイルが正本。記事側で設定を書き起こさず、ここから引用する
#    （check-provenance.mjs が引用断片の実在を突合する）。
#
# 測る対象:
#   コードは「汎用 HTTP ソフト（クライアントライブラリ・キャッシュ・プロキシ）向け」で、
#   詳細は本文へ——という分担を RFC 9457 §1 が既に書いている。ならばその汎用ソフトは、
#   コードを見て実際に何を変えるのか。ここではプロキシ（nginx）の側を測る。
#
# 🔴 ポートは 88。使用中は 80 / 81 / 82 / 83 / 84 / 85 / 86 / 87 / 443 / 444 / 445 / 446 で、
#    同じポート × 同じ server_name は後勝ちで一方が黙って ignored になる（2026-08-17 に
#    実際に 012 を壊した）。口を足したら nginx -t の warn を必ず読むこと。

# 到着記録。$msec を先頭に置くのは、Retry-After に「従ったか」をクライアント側の
# 自己申告ではなくサーバ側の到着間隔で判定するため（002 / 006 と同じ規約）。
# cs はシナリオ、cl はクライアント識別子で、測定スクリプトがクエリとして付ける。
log_format s004 '$msec $time_iso8601 $request_method $status uri="$request_uri" '
                'cs=$arg_cs cl=$arg_cl wa="$sent_http_www_authenticate" '
                'ra="$sent_http_retry_after" cache=$upstream_cache_status';

# キャッシュがコードで挙動を変えるかを測るための領域。
# RFC 6585 §4 は 429 について MUST NOT be stored by a cache と規定する。
proxy_cache_path /var/cache/nginx/004 levels=1:2 keys_zone=cache004:1m max_size=16m
                 inactive=10m use_temp_path=off;

server {
    # 記事 004 専用の入口
    listen 88;
    server_name localhost;

    access_log /results/004-status/access.log s004;

    # --- 経路 A: そのまま転送する（素の観測） -------------------------------
    location /004/api/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
    }

    # --- 経路 B: プロキシが WWW-Authenticate を剥がす -----------------------
    #
    # 「401 を返すとブラウザのログインダイアログが出てしまう」への回避策として
    # 英語圏で紹介される手段。剥がした結果、401 のままで何が変わるのかを測る。
    location /004/stripped/ {
        proxy_pass http://app_upstream/004/api/;
        proxy_set_header Host $host;
        proxy_hide_header WWW-Authenticate;
    }

    # --- 経路 C: プロキシがエラー応答を差し替える ---------------------------
    #
    # 🔴 proxy_intercept_errors を on にすると、上流が返した本文は捨てられ、
    #    error_page の中身に置き換わる。Problem Details（RFC 9457）で本文へ書いた
    #    詳細が、経路の途中で消えるかどうかがここで分かる。
    location /004/intercept/ {
        proxy_pass http://app_upstream/004/api/;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 401 403 404 429 503 /004/err.html;
    }

    location = /004/err.html {
        internal;
        alias /usr/share/nginx/public/004/err.html;
    }

    # --- 経路 D: 前段にキャッシュを置く -------------------------------------
    #
    # proxy_cache_valid any は「コードを問わず保存する」という指定。これで保存されない
    # コードがあれば、それはキャッシュ側がステータスコードを見て判断している証拠になる。
    location /004/cached/ {
        proxy_pass http://app_upstream/004/api/;
        proxy_set_header Host $host;
        proxy_cache cache004;
        proxy_cache_valid any 60s;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- 経路 D': 保存の判断を応答側に委ねる対照 ----------------------------
    #
    # 🔴 上の /004/cached/ は proxy_cache_valid any で「コードを問わず保存しろ」と
    #    こちらが命じている。それで 429 が保存されても、測れたのは設定であって
    #    nginx の判断ではない。ここでは proxy_cache_valid を書かず、保存の可否を
    #    上流の Cache-Control に委ねる。RFC 6585 §4 の MUST NOT を実装が持っている
    #    なら、Cache-Control: max-age がついた 429 でも保存されないはず。
    location /004/cached-cc/ {
        proxy_pass http://app_upstream/004/api/;
        proxy_set_header Host $host;
        proxy_cache cache004;
        proxy_cache_key "cc:$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- nginx 自身が返す 401 / 403（アプリを通さない対照）------------------
    #
    # 同じ「入れない」でも、認証を要求する側（401）と拒否する側（403）で
    # nginx が何を添えるかが違う。アプリの実装ではなくサーバの既定を測る。
    location /004/nginx/basic/ {
        auth_basic "004";
        auth_basic_user_file /etc/nginx/conf.d/008-authzone.htpasswd;
        alias /usr/share/nginx/public/004/;
    }

    location /004/nginx/deny/ {
        deny all;
        alias /usr/share/nginx/public/004/;
    }

    # --- 測定ページ（M2・ブラウザからの観測）--------------------------------
    location /004/page/ {
        alias /usr/share/nginx/public/004/;
        index index.html;
    }
}
