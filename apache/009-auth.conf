# 009-auth.conf — 記事 009 の設定の正本（Apache 側・CGIPassAuth の対照）
#
# 🔴 CGIPassAuth の既定は Off。Apache は Authorization を CGI から隠す。
#    「Normally these HTTP headers are hidden from scripts.」（httpd 2.4 core）
#    同じスクリプトを 2 つの URL 空間に置き、Off（既定）と On の差だけを読む。
#
# 本ファイルは httpd-foreground へ -c で渡して読み込ませる（compose.yaml の command）。
# 既に読み込まれているモジュールを再指定しても Apache は警告のみで続行する。

LoadModule cgid_module modules/mod_cgid.so
# P6 の .htaccess が使う。httpd の既定 conf ではコメントアウトされている。
LoadModule rewrite_module modules/mod_rewrite.so

ScriptAlias /009/cgi-off/       "/usr/local/apache2/cgi-bin-off/"
ScriptAlias /009/cgi-on/        "/usr/local/apache2/cgi-bin-on/"
ScriptAlias /009/cgi-rewrite/   "/usr/local/apache2/cgi-bin-rewrite/"
ScriptAlias /009/cgi-setenvif/  "/usr/local/apache2/cgi-bin-setenvif/"
ScriptAlias /009/cgi-htaccess/  "/usr/local/apache2/cgi-bin-htaccess/"

# P4 既定（CGIPassAuth を書かない）
<Directory "/usr/local/apache2/cgi-bin-off">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

# P5 明示的に解除する
<Directory "/usr/local/apache2/cgi-bin-on">
    AllowOverride None
    Options +ExecCGI
    CGIPassAuth On
    Require all granted
</Directory>

# ---------------------------------------------------------------------------
# P6 / P7: CGIPassAuth は既定 Off のまま、.htaccess で自分で環境変数へ写す
#
# 🔴 国内で実際に案内されている対処はこちら。CGIPassAuth はサーバ全体の設定で、
#    レンタルサーバーの利用者は触れないことが多い。.htaccess なら管理画面から入る。
#    AllowOverride を開けて、対処そのものは .htaccess 側に置く（読者が打つ形と同じ）。
# ---------------------------------------------------------------------------

# P6 mod_rewrite で写す（.htaccess = apache/htaccess-rewrite/.htaccess）
<Directory "/usr/local/apache2/cgi-bin-rewrite">
    AllowOverride FileInfo
    Options +ExecCGI
    Require all granted
</Directory>

# P7 mod_setenvif で写す（.htaccess = apache/htaccess-setenvif/.htaccess）
<Directory "/usr/local/apache2/cgi-bin-setenvif">
    AllowOverride FileInfo
    Options +ExecCGI
    Require all granted
</Directory>

# ---------------------------------------------------------------------------
# P8: CGIPassAuth そのものを .htaccess に置く
#
# 🔴 公式は CGIPassAuth の Context を directory と .htaccess、Override を
#    AuthConfig と定めている。「サーバ全体の設定だから触れない」は正確でなく、
#    事業者が AllowOverride AuthConfig を許していれば利用者が 1 行で解除できる。
#    P6 / P7（環境変数へ写す）と同じ URL 空間の作りで対照を取る。
# ---------------------------------------------------------------------------

# P8 .htaccess に CGIPassAuth On（.htaccess = apache/htaccess-cgipassauth/.htaccess）
<Directory "/usr/local/apache2/cgi-bin-htaccess">
    AllowOverride AuthConfig
    Options +ExecCGI
    Require all granted
</Directory>

# ---------------------------------------------------------------------------
# P9: 実行方式を CGI から FastCGI（PHP-FPM）へ変える経路
#
# 🔴 CGIPassAuth は書かない（既定 Off のまま）。
#    共用サーバーの管理画面で「CGI 版 → モジュール版 / FPM 版」を切り替える操作に
#    相当する。.htaccess を一切書かずに届くのかを、Apache 側で実測する。
#    終端は P3（nginx の fastcgi_pass）と同じ php/whoami.php を使う（複製しない）。
# ---------------------------------------------------------------------------

LoadModule proxy_module        modules/mod_proxy.so
LoadModule proxy_fcgi_module   modules/mod_proxy_fcgi.so

<Location "/009/fpm/">
    Require all granted
</Location>

ProxyPassMatch "^/009/fpm/whoami$" "fcgi://php:9000/var/www/html/whoami.php"

# P10 対照: 同じ FastCGI 経路に CGIPassAuth On を書く
#      P9 が落ちる原因が CGIPassAuth の既定 Off かどうかを切り分ける。
<Location "/009/fpm-on/">
    Require all granted
    CGIPassAuth On
</Location>

ProxyPassMatch "^/009/fpm-on/whoami$" "fcgi://php:9000/var/www/html/whoami.php"
