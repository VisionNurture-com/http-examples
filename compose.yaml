# compose.yaml — M1 / M2 の基盤
#
# M1: サーバ ↔ curl（CI で回る）
# M2: 上記 + ホストの実ブラウザ（手動）
#
# 起動前に証明書を用意すること:
#   bash tools/gen-certs.sh
#
# 版は固定する。実測値の出典を残すため、版が動いたら results/ を測り直す。

services:
  edge:
    # nginx mainline（HTTP/3 を扱うため stable ではなく mainline）
    image: nginx:1.31.4-alpine
    container_name: http-examples-edge
    depends_on:
      - app
      # 🔴 fastcgi_pass は起動時に名前を解決する。php が居ないと nginx が
      #    "host not found in upstream" で起動に失敗する（記事 009 の P3）。
      - php
    ports:
      - "8080:80"
      # 別オリジン（ポート違い）。008 の CORS 測定に使う
      - "8081:81"
      # add_header の落ち方を測るサーバ（008 シナリオ 3・curl のみ）
      - "8082:82"
      # 第 3 のオリジン（008 シナリオ 4 のクロスオリジン リダイレクト先）
      - "8083:83"
      # 記事 006 専用の入口。同じ設定を http と https の両方で出す
      # （Firefox は immutable を https でのみ honor するため対照が要る）
      - "8084:84"
      - "8444:444"
      # 記事 003 専用の入口。ワイヤに出たメソッドを専用の到着記録で読む
      - "8085:85"
      - "8443:443"
      # HTTP/3 は同じ 443 を UDP で使う。Docker Desktop の UDP 転送が
      # 測定に耐えるかは vm/README.md の判定結果を参照。
      - "8443:443/udp"
      # 記事 012 専用の入口。443 は 000-base.conf が localhost を取っているため、
      # 名前解決を上書きできないブラウザ（firefox / webkit）からも測れる口を分ける。
      - "8445:445"
      # 記事 012 の Vary 事故再現（共有キャッシュを前段に置く）
      - "8448:446"
      # 記事 002 専用の入口。静的配信（nginx 単独）と転送（nginx→Express）を
      # 別の location に分け、削ったヘッダがどの層で効いたかを分離する。
      # 🔴 コンテナ側は 87。86 は 012 が使っている（衝突すると相手が黙って壊れる）。
      - "8087:87"
      # 記事 004 専用の入口。素の転送 / ヘッダを剥がす / エラーを差し替える /
      # キャッシュを挟む の 4 経路を同じポートの別 location に並べ、
      # プロキシがステータスコードを見て何を変えるかを測る。
      - "8088:88"
      # 記事 009 専用の入口。
      #   91 = カード①の「別オリジン」（localhost:8080 とポートだけ違う）
      #   92 = カード②の「構成別の到着」（素の転送 / 空文字剥がし / FastCGI）
      - "8091:91"
      - "8092:92"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./public:/usr/share/nginx/public:ro
      - ./certs:/etc/nginx/certs:ro
      - ./results:/results
    networks:
      - httpnet

  app:
    # Express 5 の既定挙動そのものが観測対象のため、依存を持つビルドにする
    # （node_modules が要るので volume マウントでは動かない）
    build:
      context: ./app
    container_name: http-examples-app
    environment:
      PORT: "3000"
      NODE_ENV: "production"
    ports:
      # 🔴 記事 012 の 103 Early Hints 測定で、nginx を挟まない対照を取るために直接開ける。
      #    「103 が届かない」のがアプリ側の問題かプロキシの問題かを分けるため。
      - "8086:3000"
    networks:
      - httpnet

  # 103 を HTTP/2 + TLS で出す対照。Express 直結は HTTP/1.1 の平文になるため、
  # 「ブラウザが 103 を活かさない」のが条件のせいかどうかを分けられない。
  h2:
    build:
      context: ./app
    container_name: http-examples-h2
    command: ["node", "012-compression/h2-server.mjs"]
    environment:
      H2_PORT: "3443"
      CERT_DIR: "/etc/certs"
      NODE_ENV: "production"
    volumes:
      - ./certs:/etc/certs:ro
    ports:
      - "8447:3443"
    networks:
      - httpnet

  # 記事 004 の対照。nginx とは別実装のキャッシュがステータスコードをどう扱うかを測る。
  # nginx 側は proxy_cache_valid で保存を命じられるが、こちらは既定 VCL の判断に委ねる。
  cache:
    image: varnish:9.0
    container_name: http-examples-cache
    depends_on:
      - app
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    environment:
      VARNISH_SIZE: "32M"
    ports:
      - "8089:80"
    networks:
      - httpnet

  # 記事 004 の対照。同じ状況でサーバ・プロキシ・WAF がそれぞれ何を返すか、の
  # WAF 側。OWASP CRS を遮断モードで前段に置き、返すコードと本文を測る。
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: http-examples-waf
    depends_on:
      - app
    environment:
      BACKEND: "http://app:3000"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      # 遮断時に返すコード。既定は 403。「WAF は何を返すか」の観測対象そのもの
      MODSEC_DEFAULT_PHASE1_ACTION: "phase:1,log,auditlog,deny,status:403"
      MODSEC_DEFAULT_PHASE2_ACTION: "phase:2,log,auditlog,deny,status:403"
    ports:
      - "8090:8080"
    networks:
      - httpnet

  # 記事 009 の対照。nginx の fastcgi_pass 越しに Authorization が届くかを測る。
  # 公式ドキュメントでは fastcgi_pass_request_headers が既定 on で、クライアントの
  # ヘッダーは HTTP_AUTHORIZATION として渡るはず。それを実測で確かめる側。
  php:
    image: php:8.5.9-fpm-alpine
    container_name: http-examples-php
    volumes:
      - ./php:/var/www/html:ro
    networks:
      - httpnet

  # 記事 009 の対照。CGIPassAuth の既定は Off で、Apache は Authorization を
  # CGI から隠す。同じスクリプトを Off / On の 2 つの URL 空間へ置いて差を測る。
  #
  # 🔴 httpd-foreground は引数をそのまま httpd へ渡す。追加設定は -c で読ませ、
  #    イメージ同梱の httpd.conf には触らない（版が動いても壊れないようにする）。
  httpd:
    image: httpd:2.4.68-alpine
    container_name: http-examples-httpd
    command: ["httpd-foreground", "-c", "Include conf/extra/009-auth.conf"]
    volumes:
      - ./apache/009-auth.conf:/usr/local/apache2/conf/extra/009-auth.conf:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin-off:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin-on:ro
      # P6 / P7 は P4 / P5 と同じ CGI を .htaccess つきの URL 空間に置く。
      # 🔴 終端のスクリプトを複製しない（同じケース定義を 2 箇所に書かない）。
      #    ディレクトリを敷いてから .htaccess を重ねるため、
      #    外側のディレクトリ側だけ :ro を外す（内側の mountpoint を作れるようにする）。
      #    .htaccess 自体は :ro。コンテナから書き戻す経路は使わない。
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin-rewrite
      - ./apache/htaccess-rewrite/.htaccess:/usr/local/apache2/cgi-bin-rewrite/.htaccess:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin-setenvif
      - ./apache/htaccess-setenvif/.htaccess:/usr/local/apache2/cgi-bin-setenvif/.htaccess:ro
      # P8 は CGIPassAuth そのものを .htaccess に置く（AllowOverride AuthConfig）。
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin-htaccess
      - ./apache/htaccess-cgipassauth/.htaccess:/usr/local/apache2/cgi-bin-htaccess/.htaccess:ro
    ports:
      - "8093:80"
    networks:
      - httpnet

networks:
  httpnet:
    driver: bridge
